services:
  postgres:
    image: postgres
    environment:
      - POSTGRES_PASSWORD=postgrespw
    ports:
      - 1010:5432
    volumes:
      - pgdata:/var/lib/postgresql
  mongodb:
    image: mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=mongopw
    ports:
      - 1020:27017
    volumes:
      - mongodata:/data/db
volumes:
  pgdata:
  mongodata: